<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Functions Example</title>
</head>
<body>

  <button onclick="myfunction(5)">Execute JS function</button>
  
  <p>A function can access variables defined inside the function:</p>
  <button type="button" onclick="myFunction()">Click Me!</button>
  
  <p id="demo"></p>
  <p id="demo1"></p>
  <p id="demo2"></p>

  <script>
    function myfunction(x, y, z) {
      if (y === undefined) {
        y = 2;
      }
      if (z === undefined) {
        z = 3; 
      }
      document.getElementById("demo").innerHTML = x * y * z;
    }

    
    function myFunction() {
      var a = 4;
      var b = 5;
      document.getElementById("demo1").innerHTML = a;
      document.getElementById("demo2").innerHTML = b;
    }
  </script>

</body>
</html>
