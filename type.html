<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       body{background-color: darkblue; color:white; font-family: Arial, sans-serif;}
    
    _hero_name {fontsize: 60px; font-weight: bold; color:yellow; text-shadow:3px 3px orange;}
    
    .tagline {
        font-style: italic;
        color: lightblue;
        text-transform: capitalize;
    }


    .label {text-transform: uppercase;
    text-decoration: underline;
    color: coral;
    }

    .power {font-weight: bold;
    color: cyan;}

    .weakness {
        text-decoration: line-through;
        color: gray;
    }
    .badge {
        font-size: 29px;
        font-weight: bold;
        color: goldenrod;
        transform: rotate(15deg);
    }
    
    </style>
</head>
<body>
  <h1 class="hero-name">Thunder Kid</h1> 
  <p class="tagline">The most powerful hero in the school</p>
  
  <h2 class="label">Super Powers</h2>
  <p class="power">Can run faster than a cheetah</p>
  <p class="power">Can lift a school bus</p>

  <h2 class="label">weakness</h2>
  <p class="weakness">Maths homework</p>
  <p class="weakness">Broccoli</p>

  <p class="badge">Top Hero</p>
</body>
</html>
